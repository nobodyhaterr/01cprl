<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Site de presentation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="nav glass">
    <a href="#accueil" class="logo" aria-label="Accueil">
      <img src="logo.png" alt="Logo">
    </a>

    <button class="btn" id="theme" aria-label="Changer de thème">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
      </svg>
    </button>

    <button class="btn burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="menu" id="menu" aria-label="Navigation principale"></nav>
  </header>

  <main id="main"></main>

  <footer>
    <div class="wrap">
      <span>© Melvyn BAURE</span>
      <div id="foot"></div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
